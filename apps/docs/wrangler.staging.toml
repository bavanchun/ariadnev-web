# Documentation unit — staging. Assets-only Worker serving the static Next
# export; the topology deploys it before the edge unit so the marketing site
# never links at a documentation host that does not answer yet.
#
# Binding the hostname as a Custom Domain makes Cloudflare provision the DNS record and
# the TLS certificate as part of `wrangler deploy`; no manual DNS step and no
# Zone.DNS:Edit permission. Nothing here may contain an account id, zone id,
# or secret.

name = "ariadnev-docs-staging"
compatibility_date = "2026-08-08"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "staging.docs.ariadnev.com", custom_domain = true }
]

[assets]
directory = "./out"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
