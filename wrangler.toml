name = "vcskill"
main = "worker.js"
compatibility_date = "2026-07-20"

# Bind vcskill.vchun.dev as a Custom Domain — Cloudflare auto-provisions the DNS
# record + TLS cert and routes the whole host to this Worker.
routes = [
  { pattern = "vcskill.vchun.dev", custom_domain = true }
]

# Import landing.html as a string module (served at `/`).
# fallthrough = true keeps Wrangler's default Text rules (.txt/.sql) active too.
rules = [
  { type = "Text", globs = ["**/*.html"], fallthrough = true }
]

# Secret (do NOT put the value here — set it out of band):
#   wrangler secret put GH_TOKEN
# A fine-grained PAT with Contents: read on bavanchun/vcskill.
