# ariadnev release bridge — interim owner of ariadnev.com.
#
# `custom_domain = true` makes Cloudflare provision the proxied DNS record and
# the TLS certificate as part of `wrangler deploy`, so the apex needs no manual
# DNS step and no Zone.DNS:Edit permission.
#
# This is a separate Worker, not a new route on the legacy `vcskill` Worker.
# The legacy Worker is the first-cutover rollback target and its binding map and
# credential context are frozen; adding a route would mutate the binding map that
# `topology.json`'s `firstCutover.restoresLegacyBinding` exists to restore.
#
# Lifetime: deleted at the Phase 12 candidate-b cutover, when `ariadnev.com`
# moves to `vcskill-edge-combined`. The `vcskill.vchun.dev` redirect rule in
# `rules/legacy-host-redirect.json` outlives this Worker and is not part of it.

name = "ariadnev-bridge"
main = "src/index.js"
compatibility_date = "2026-07-20"

# Secret (set out of band, never committed):
#   wrangler secret put GH_TOKEN --config workers/bridge/wrangler.toml
# A fine-grained PAT with Contents: read on bavanchun/ariadnev-kit, in this
# Worker's own secret namespace. Rotating it cannot invalidate the legacy
# Worker's token, and vice versa.

routes = [
  { pattern = "ariadnev.com", custom_domain = true },
  { pattern = "www.ariadnev.com", custom_domain = true }
]

[observability]
enabled = true
