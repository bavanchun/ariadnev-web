name = "vcskill-edge-staging"
main = "src/index.js"
compatibility_date = "2026-08-08"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "staging.vcskill.vchun.dev/install*", zone_name = "vchun.dev" },
  { pattern = "staging.vcskill.vchun.dev/install.ps1*", zone_name = "vchun.dev" },
  { pattern = "staging.vcskill.vchun.dev/version*", zone_name = "vchun.dev" },
  { pattern = "staging.vcskill.vchun.dev/download/*", zone_name = "vchun.dev" },
]

[vars]
TOPOLOGY_MODE = "edge"
ALLOWED_HOSTS = "staging.vcskill.vchun.dev"

[[services]]
binding = "SITE"
service = "vcskill-site-staging"
