# Candidate B — production identity profile.
#
# Same shape as the staging profile; a Worker identity and secret namespace
# deliberately separate from the retained legacy `vcskill` Worker and from the
# interim `ariadnev-bridge`, so provisioning this Worker's PAT cannot mutate
# either rollback target.
#
# The apex Custom Domain is bound to `ariadnev-bridge` until the production
# cutover releases it (plans/260816-1437-ariadnev-candidate-b-cutover, phase 6).
# Deploying this profile while the bridge still owns the hostname fails at the
# Custom Domain step by design; the cutover deploys the `.detached` variant
# first, then this one after the bridge is deleted.

name = "ariadnev-edge"
main = "src/index.js"
compatibility_date = "2026-07-20"
# The only public origins are the bound hostnames: no workers.dev subdomain and
# no preview URLs, which would sit outside the zone-level ingress rule.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "ariadnev.com", custom_domain = true },
  { pattern = "www.ariadnev.com", custom_domain = true }
]

[assets]
directory = "../../apps/site/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[observability]
enabled = true
