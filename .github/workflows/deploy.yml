# Reusable deploy for the ariadnev web surface.
#
# The same workflow body runs staging and production; only the environment and
# its protection rules differ. That is deliberate — Phase 11 qualifies exactly
# the workflow Phase 12 later runs against production, so there is no
# production-only code path that was never rehearsed.
#
# Inputs are immutable. `productSha` is the only thing ever built or deployed;
# `qualificationEvidenceSha` is a descendant commit that carries the evidence
# attesting that product and can never change what ships.
#
# Every `uses:` is pinned to a full commit SHA, and no job inherits
# workflow-wide write permission.

name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      input_path:
        description: Path to the committed deployment input JSON
        required: true
        type: string

permissions: {}

concurrency:
  # One deployment per environment at a time, and never cancelled midway: an
  # interrupted deploy leaves the topology half-swapped.
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate immutable input
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      product_sha: ${{ steps.read.outputs.product_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject any input that is not fully pinned
        run: node scripts/deploy/validate-deployment-input.mjs "${{ inputs.input_path }}"
      - id: read
        run: echo "product_sha=$(node -p "require('./${{ inputs.input_path }}').productSha")" >> "$GITHUB_OUTPUT"

  environment-policy:
    name: Verify production controls
    needs: preflight
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    permissions:
      # Read-only. The web repository holds no release-write authority over the
      # core repository and must not be able to acquire one here.
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require protected environments and an immutable release policy
        env:
          GITHUB_TOKEN: ${{ secrets.CORE_POLICY_READ_TOKEN }}
        run: node scripts/deploy/verify-production-environment.mjs

  build:
    name: Build product at productSha
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the immutable product commit is ever built.
          ref: ${{ needs.preflight.outputs.product_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tests/site drives the built pages in a real browser (progressive
      # enhancement, performance budget); the qualification gate is not
      # complete without it.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:qualification
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v5
        with:
          name: web-product-${{ needs.preflight.outputs.product_sha }}
          path: |
            apps/site/dist
            apps/docs/out
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy units
    needs: [preflight, build]
    runs-on: ubuntu-latest
    # Human approval and branch policy come from the GitHub environment, not
    # from logic in this file that a caller could route around.
    environment: ${{ inputs.environment == 'production' && 'web-production' || 'web-staging' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.product_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The deploy step ships exactly the bytes the build job qualified: the
      # artifact is downloaded, never rebuilt here, so a second build cannot
      # diverge from the one the qualification gate passed.
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: web-product-${{ needs.preflight.outputs.product_sha }}
          path: .
      - name: Refuse to deploy without both unit outputs
        run: test -f apps/site/dist/index.html && test -f apps/docs/out/index.html
      - name: Reconcile the source-owned ingress rule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WAF_TOKEN }}
        run: node scripts/manage-edge-ingress-rule.mjs apply "${{ inputs.environment }}"
      - name: Deploy in topology order and smoke every machine route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: node scripts/deploy/deploy-units.mjs "${{ inputs.input_path }}"
      - name: Verify convergence against the declared release
        run: node scripts/deploy/verify-convergence.mjs "${{ inputs.input_path }}"
      - name: Write the sanitized cutover record
        run: |
          node scripts/deploy/write-cutover-record.mjs \
            "${{ inputs.input_path }}.record.json" --out cutover-record.json
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v5
        with:
          name: cutover-record-${{ inputs.environment }}
          path: cutover-record.json
          if-no-files-found: error
          retention-days: 90
