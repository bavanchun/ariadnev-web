# Reusable rollback for the vcskill web surface.
#
# Rehearsed in staging before it is ever needed in production, so the recovery
# path is not written under pressure.
#
# Two distinct recoveries share this workflow and are never conflated:
#   * a version rollback, where a unit keeps its hostname and only its Worker
#     version moves backwards, and
#   * a first-cutover rollback, which restores the captured legacy custom-domain
#     and route binding map and removes the new documentation hostname.
#
# The retained legacy Worker credential is never written here. Mutating it while
# rollback is still an available recovery path would destroy the target being
# rolled back to.

name: rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      plan_path:
        description: Path to the committed rollback plan JSON
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Restore explicit versions
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'production' && 'web-production' || 'web-staging' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore units in reverse topology order
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: node scripts/deploy/rollback-units.mjs "${{ inputs.plan_path }}"
      - name: Smoke every machine route after restoration
        run: node scripts/deploy/verify-convergence.mjs "${{ inputs.plan_path }}.convergence.json"
      - name: Write the sanitized rollback record
        run: |
          node scripts/deploy/write-cutover-record.mjs \
            "${{ inputs.plan_path }}.record.json" --out rollback-record.json
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v5
        with:
          name: rollback-record-${{ inputs.environment }}
          path: rollback-record.json
          if-no-files-found: error
          retention-days: 90
