name: Roll back immutable web units

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Exact rollback environment
        required: true
        type: choice
        options: [staging, production]
      product_sha:
        description: Exact product commit owning the rollback contract
        required: true
        type: string
      deployment_input_json:
        description: Original immutable deployment input with exact rollback versions
        required: true
        type: string
      first_cutover:
        description: Restore frozen legacy bindings, credentials, and docs ownership
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      environment: { required: true, type: string }
      product_sha: { required: true, type: string }
      deployment_input_json: { required: true, type: string }
      first_cutover: { required: true, type: boolean }
    secrets:
      CLOUDFLARE_API_TOKEN: { required: true }

permissions: {}

concurrency:
  group: web-mutation-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back ${{ inputs.environment }} to exact versions
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'production' && 'web-production' || 'web-staging' }}
    permissions:
      contents: read
    env:
      DEPLOYMENT_INPUT_JSON: ${{ inputs.deployment_input_json }}
    steps:
      - name: Checkout exact rollback contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.product_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.0.9
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.0.0"
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate immutable rollback input
        env:
          EXPECTED_ENVIRONMENT: ${{ inputs.environment }}
          EXPECTED_PRODUCT_SHA: ${{ inputs.product_sha }}
        run: |
          node scripts/deploy/validate-deployment-input.mjs --input-env=DEPLOYMENT_INPUT_JSON --skip-artifacts=true > "$RUNNER_TEMP/deployment-validation.json"
          node -e 'const v=JSON.parse(require("node:fs").readFileSync(process.argv[1]));if(v.environment!==process.env.EXPECTED_ENVIRONMENT||v.productSha!==process.env.EXPECTED_PRODUCT_SHA)process.exit(1)' "$RUNNER_TEMP/deployment-validation.json"
      - name: Reverify protected production controls
        if: inputs.environment == 'production'
        run: node scripts/deploy/verify-production-environment.mjs --input-env=DEPLOYMENT_INPUT_JSON > "$RUNNER_TEMP/production-preflight.json"
      - name: Roll back units and smoke each restored unit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIRST_CUTOVER: ${{ inputs.first_cutover }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          cloudflare_token="$CLOUDFLARE_API_TOKEN"
          export -n cloudflare_token
          unset CLOUDFLARE_API_TOKEN
          EXTRA_ARGS=()
          if [ "$FIRST_CUTOVER" = "true" ]; then EXTRA_ARGS+=(--first-cutover); fi
          printf '%s' "$cloudflare_token" | node scripts/deploy/rollback-units.mjs --input-env=DEPLOYMENT_INPUT_JSON "${EXTRA_ARGS[@]}" > "$RUNNER_TEMP/rollback-result.json"
      - name: Upload sanitized rollback evidence
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: web-rollback-${{ inputs.environment }}-${{ inputs.product_sha }}
          path: ${{ runner.temp }}/rollback-result.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
